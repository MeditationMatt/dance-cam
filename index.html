<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>DanceCam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>DanceCam</h1>
      <p id="status" class="status">Pick a song, then Record</p>
    </header>
    <div class="stage">
      <video id="preview" playsinline muted autoplay></video>
      <video id="playback" playsinline controls hidden></video>
      <div id="countdown" class="countdown" hidden></div>
      <div id="recBadge" class="rec-badge" hidden><span class="dot"></span> REC <span id="recTimer">0:00</span></div>
      <div id="error" class="error" hidden></div>
    </div>
    <div class="songbar">
      <div class="song-meta">
        <span id="songName" class="song-name">No song</span>
        <span id="songDur" class="song-dur"></span>
      </div>
      <input id="scrub" type="range" min="0" max="0" step="0.01" value="0" disabled aria-label="Start offset" />
    </div>
    <nav class="toolbar">
      <label class="btn ghost file-btn">Pick song
        <input id="songInput" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg" hidden />
      </label>
      <button id="btnFlip" class="btn ghost" type="button">Flip</button>
      <button id="btnMic" class="btn ghost" type="button" aria-pressed="false">Mic off</button>
      <label class="toggle"><input id="countdownToggle" type="checkbox" checked /><span>3-2-1</span></label>
    </nav>
    <div class="record-row"><button id="btnRecord" class="btn record" type="button" disabled>Record</button></div>
    <div id="resultBar" class="result-bar" hidden>
      <button id="btnSave" class="btn primary" type="button">Save</button>
      <button id="btnShare" class="btn ghost" type="button" hidden>Share</button>
      <button id="btnRetake" class="btn ghost" type="button">Retake</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
